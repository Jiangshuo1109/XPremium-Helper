<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X 头像快捷关注</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="brand">
        <div class="brand-mark">X</div>
        <div>
          <h1>XPremium-Helper</h1>
          <p>关系识别与快捷操作</p>
        </div>
        <label class="switch" title="启用或停用扩展">
          <input id="enabled" type="checkbox" role="switch" disabled>
          <span aria-hidden="true"></span>
        </label>
      </header>
      <div class="status-line">
        <span id="status" role="status" aria-live="polite">正在读取设置</span>
        <span class="version">0.2.1</span>
      </div>
      <section class="creator" aria-label="作者联系入口">
        <a class="creator-profile" href="https://x.com/jiangza9" target="_blank" rel="noreferrer">
          <img src="jiangza9-avatar.jpg" alt="@jiangza9 的 X 头像">
          <span><strong>禁忌の小姜</strong><small>@jiangza9 · X 主页</small></span>
        </a>
        <a class="github" href="https://github.com/Jiangshuo1109/XPremium-Helper" target="_blank" rel="noreferrer" title="打开 GitHub 项目">
          <img class="github-icon" src="github.svg" alt="GitHub">
        </a>
      </section>
      <section id="cooldown-card" class="cooldown-card" aria-labelledby="cooldown-title">
        <div class="cooldown-head"><span id="cooldown-title">回关冷却</span><span class="cooldown-state">自动同步</span></div>
        <strong id="cooldown">检查中</strong>
        <p>检测到 X 速度限制后建议冷却 30 分钟；实际恢复时间以 X 为准。</p>
      </section>
      <section class="panel" aria-labelledby="panel-title">
        <div class="panel-head">
          <h2 id="panel-title">当前页面 · 去重账号</h2>
          <button id="refresh" type="button" title="重新读取当前页面状态">刷新</button>
        </div>
        <p id="progress">正在读取识别进度</p>
        <dl id="statistics" aria-label="当前页面去重账号统计"></dl>
        <input id="search" type="search" placeholder="搜索账号" aria-label="搜索账号">
        <select id="filter" aria-label="关系筛选">
          <option value="all">全部关系</option>
          <option value="can-follow">可关注</option>
          <option value="follow-back">待回关</option>
          <option value="mutual">蓝朋友</option>
          <option value="unfollow">可取关</option>
          <option value="unknown">待确认</option>
        </select>
        <ul id="records" aria-live="polite"></ul>
      </section>
      <section class="panel reply-settings" aria-labelledby="reply-title">
        <div class="panel-head"><h2 id="reply-title">快捷回复</h2><span class="setting-state">点击生成才请求</span></div>
        <p>回复框聚焦后显示浮层；选择内容只插入草稿，不会自动发送。</p>
        <label>接口地址<input id="model-base-url" type="url" placeholder="https://api.example.com/v1"></label>
        <label>模型名称<input id="model-name" type="text" placeholder="gpt-4o-mini"></label>
        <label>API Key<input id="model-key" type="password" placeholder="只保存在本机"></label>
        <div class="settings-row">
          <label>语言<select id="model-language"><option>中文</option><option>English</option></select></label>
          <label>语气<select id="model-tone"><option>自然</option><option>简洁</option><option>热情</option><option>专业</option></select></label>
        </div>
        <div class="settings-actions"><button id="save-model" type="button">保存接口</button><button id="test-model" type="button">测试权限</button></div>
        <span id="model-status" role="status" aria-live="polite"></span>
        <details>
          <summary>管理常用回复</summary>
          <div id="preset-list"></div>
          <div class="preset-form"><input id="preset-title" placeholder="名称"><textarea id="preset-text" rows="2" placeholder="支持 {name}、{handle}、{topic}"></textarea><select id="preset-category"><option value="interaction">互动</option><option value="thanks">感谢</option><option value="polite">礼貌</option></select><button id="add-preset" type="button">添加</button></div>
        </details>
      </section>
      <footer class="updates">
        <span id="update-status" role="status">正在检查版本</span>
        <button id="check-update" type="button">检查更新</button>
        <a id="download-update" hidden href="https://github.com/Jiangshuo1109/XPremium-Helper/releases" target="_blank" rel="noreferrer">下载新版</a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
