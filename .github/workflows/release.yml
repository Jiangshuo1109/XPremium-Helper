name: Preview release

on:
  push:
    tags: ["v*-preview"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/package.mjs
      - run: node scripts/release-notes.mjs
      - name: Publish complete preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release/existing.json 2>/dev/null; then
            node -e 'if (!require("./release/existing.json").isDraft) throw new Error("Refusing to overwrite a published release")'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "XPremium Helper $RELEASE_TAG" --notes-file release/NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release/*-preview.zip release/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --notes-file release/NOTES.md --prerelease --draft=false
      - name: Save isolated browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-browser-evidence
          path: |
            artifacts/*.json
            artifacts/*.png
          retention-days: 30
          if-no-files-found: warn
